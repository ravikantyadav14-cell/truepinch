name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  functions_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: node-version: 18, cache: 'npm'
      - name: Install functions deps
        run: |
          cd functions
          npm ci
      - name: Test functions
        run: |
          cd functions
          npm test

  deploy_functions:
    if: github.ref == 'refs/heads/main' && secrets.FIREBASE_TOKEN != ''
    runs-on: ubuntu-latest
    needs: [ build_and_test, functions_tests ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Deploy functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT }}
        run: |
          firebase deploy --only functions --project $FIREBASE_PROJECT
